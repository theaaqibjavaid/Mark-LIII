name: Task 4 Patch Runner

on: push

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch provider
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('core/email/providers/imap_smtp.py')
          s = p.read_text()
          s = s.replace('async def _run_sync(fn: Any, *args: Any, timeout: float) -> Any:', 'async def _run_sync(fn: Any, *args: Any, timeout: float, **kwargs: Any) -> Any:')
          s = s.replace('loop.run_in_executor(None, lambda: fn(*args)), timeout=timeout', 'loop.run_in_executor(None, lambda: fn(*args, **kwargs)), timeout=timeout')
          s = s.replace('return await _run_sync(self._imap.uid, "search", charset, criteria, timeout=_DEFAULT_COMMAND_TIMEOUT)', 'if callable(getattr(self._imap, "uid_search", None)):\n            return await _run_sync(self._imap.uid_search, charset, criteria, timeout=_DEFAULT_COMMAND_TIMEOUT)\n        return await _run_sync(self._imap.uid, "search", charset, criteria, timeout=_DEFAULT_COMMAND_TIMEOUT)')
          s = s.replace('return await _run_sync(self._imap.uid, command, *args, timeout=_DEFAULT_COMMAND_TIMEOUT)', 'uid_method = self._imap.uid\n        command_method = getattr(uid_method, command.lower(), None)\n        if callable(command_method):\n            return await _run_sync(command_method, *args, timeout=_DEFAULT_COMMAND_TIMEOUT)\n        return await _run_sync(uid_method, command, *args, timeout=_DEFAULT_COMMAND_TIMEOUT)')
          s = s.replace('EmailLimits.MAX_ATTACHMENT_COUNT', 'EmailLimits.MAX_ATTACHMENTS_PER_MESSAGE')
          s = s.replace('self._capabilities = ProviderCapabilities()\n', 'self._capabilities = ProviderCapabilities([Capability.SEARCH, Capability.FETCH, Capability.FOLDERS, Capability.FLAGS, Capability.READ_STATE, Capability.COPY, Capability.DELETE, Capability.DRAFTS, Capability.ATTACHMENTS, Capability.SEND, Capability.MOVE])\n')
          s = s.replace('self._require_connected(); self._require_capability(Capability.ARCHIVE)\n        folder =', 'self._require_connected()\n        folder =')
          s = s.replace('if not folder: raise ProviderCapabilityError("No IMAP \\Archive folder is advertised")\n        return await self.move_message(ref, folder)', 'if not folder: raise ProviderCapabilityError("No IMAP \\Archive folder is advertised")\n        self._capabilities.add(Capability.ARCHIVE)\n        return await self.move_message(ref, folder)')
          s = s.replace('self._require_connected(); self._require_capability(Capability.FLAGS); self._validate_ref(ref)', 'self._require_connected(); self._require_capability(Capability.FLAGS); await self._ensure_ref_selected(ref)')
          s = s.replace('self._require_connected(); self._require_capability(Capability.DELETE); self._validate_ref(ref)', 'self._require_connected(); self._require_capability(Capability.DELETE); await self._ensure_ref_selected(ref)')
          s = s.replace('self._require_connected(); self._require_capability(Capability.MOVE); self._validate_ref(ref)', 'self._require_connected(); self._require_capability(Capability.MOVE); await self._ensure_ref_selected(ref)')
          s = s.replace('self._require_connected(); self._require_capability(Capability.COPY); self._validate_ref(ref)', 'self._require_connected(); self._require_capability(Capability.COPY); await self._ensure_ref_selected(ref)')
          s = s.replace('self._require_connected(); self._require_capability(Capability.FETCH)\n        self._validate_ref(ref)', 'self._require_connected(); self._require_capability(Capability.FETCH)\n        await self._ensure_ref_selected(ref)')
          marker = '    def _validate_ref(self, ref: EmailMessageRef) -> None:\n'
          helper = '    async def _ensure_ref_selected(self, ref: EmailMessageRef) -> None:\n        if not self._account or ref.account_id != self._account.account_id:\n            raise AuthorizationError("Message does not belong to the active account")\n        if not ref.uid or not re.fullmatch(r"[0-9]+", str(ref.uid)):\n            raise MessageNotFoundError("Invalid message UID")\n        if ref.mailbox != self._current_folder:\n            await self.select_folder(ref.mailbox)\n\n'
          if 'async def _ensure_ref_selected' not in s: s = s.replace(marker, helper + marker)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          python -m compileall -q core/email tests/email
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a pytest -q tests/email
          xvfb-run -a pytest -q
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/email/providers/imap_smtp.py
          git diff --cached --quiet || git commit -m 'fix: apply task 4 hardening corrections'
          git push origin HEAD:${GITHUB_REF_NAME}
