name: Task 4 limit fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply limit validations
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('core/email/providers/imap_smtp.py')
          s = p.read_text()
          old = '''        recipients = list(to) + list(cc or []) + list(bcc or [])\n        if not recipients or any("@" not in r.address for r in recipients): raise InvalidRecipientError("Invalid or missing recipient")\n        if len(attachments or []) > EmailLimits.MAX_ATTACHMENTS_PER_MESSAGE: raise AttachmentTooLargeError("Attachment count exceeds limit")'''
          new = '''        recipients = list(to) + list(cc or []) + list(bcc or [])\n        if not recipients or any("@" not in r.address for r in recipients): raise InvalidRecipientError("Invalid or missing recipient")\n        EmailLimits.validate_recipient_count(len(recipients))\n        EmailLimits.validate_subject_length(subject)\n        if len(attachments or []) > EmailLimits.MAX_ATTACHMENTS_PER_MESSAGE: raise AttachmentTooLargeError("Attachment count exceeds limit")'''
          if old not in s:
              raise SystemExit('target send validation block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify targeted tests
        run: pytest -q tests/email/test_imap_smtp.py
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/email/providers/imap_smtp.py
          git commit -m 'fix: enforce email send limits'
          git push